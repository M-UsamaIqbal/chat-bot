name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Don't download Playwright browsers during install — not needed for CI checks
  # (the serverless audit uses @sparticuz/chromium at runtime).
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Dummy public values so the build never reads undefined config.
          # No real secrets — the app runs in fallback/demo mode at build time.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_DEFAULT_ORG_SLUG: support
